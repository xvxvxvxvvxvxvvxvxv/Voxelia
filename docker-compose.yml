# Voxelia per Suga (docker-compose importato dal canvas o dal MCP di Suga).
# Suga salta i servizi con "build:": l'immagine va pubblicata prima (vedi .github/workflows/docker.yml).
# Dopo l'import: imposta ADMIN_PASSWORD come variabile sensibile, aggiungi un endpoint HTTPS sulla porta 3000.
services:
  voxelia:
    image: ghcr.io/teamvoxelia/voxelia:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATA_FILE: /data/voxelia-data.json
      MONDI_DIR: /data/mondi
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # HTTPS direttamente dal server (per il Meta Quest in rete locale): togli i commenti qui e al volume ./certs.
      # Su Suga non serve: lì l'HTTPS lo fa l'endpoint.
      # TLS_CERT: /certs/cert.pem
      # TLS_KEY: /certs/key.pem
    volumes:
      - voxelia-data:/data
      # - ./certs:/certs:ro

volumes:
  voxelia-data:
