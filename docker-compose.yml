# Voxelia 7.9.3 per Suga (docker-compose importato dal canvas o dal MCP di Suga).
# Suga salta i servizi con "build:": l'immagine va pubblicata prima (vedi .github/workflows/docker.yml).
# Dopo l'import: imposta ADMIN_PASSWORD come variabile sensibile, aggiungi un endpoint HTTPS sulla porta 3000.
services:
  voxelia:
    image: ghcr.io/teamvoxelia/voxelia:7.9.3
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATA_FILE: /data/voxelia-data.json
      MONDI_DIR: /data/mondi
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - voxelia-data:/data

volumes:
  voxelia-data:
