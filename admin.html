<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voxelia · Pannello Admin</title><meta name="robots" content="noindex">
<style>
:root{--bg:#10131a;--pn:rgba(18,23,38,.9);--pn2:rgba(35,43,68,.85);--ln:#f5b94240;--fg:#e8ecf4;--mu:#9aa4b8;--ac:#f5b942;--ac2:#8a3b12;--rd:#e5534b;--gr:#4cc46a;--bl:#4aa3ff;--or:#ff9a5a;--pu:#b866ff}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:14px Georgia,'Times New Roman',serif}
canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#veil{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 30%,rgba(10,13,26,.35),rgba(10,13,26,.88));transition:background .6s}body.in #veil{background:linear-gradient(rgba(10,13,26,.72),rgba(10,13,26,.86))}
.screen{position:relative;z-index:1}
h1,h2,h3,h4{font-weight:normal;margin:0}
.logo{color:var(--ac);letter-spacing:5px;text-shadow:3px 3px 0 var(--ac2)}
button,.btn{font:inherit;background:#2a3350;color:#fff;border:1px solid #f5b94288;padding:7px 12px;border-radius:3px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block;transition:background .12s,transform .12s}
button:hover,.btn:hover{background:#3b4770}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:default}
button.gold{background:#5a4320;border-color:var(--ac)}button.gold:hover{background:#735828}
button.red{background:#5a2228;border-color:var(--rd)}button.red:hover{background:#74303a}
button.sm{padding:3px 9px;font-size:12.5px}
input,select,textarea{font:inherit;background:#0b0e18cc;color:var(--fg);border:1px solid #f5b94266;padding:7px 9px;border-radius:3px;min-width:0}
input[type=number]{width:90px}
label{color:var(--mu)}
.mu{color:var(--mu);font-size:12.5px}.up{color:var(--gr)}.dn{color:var(--rd)}
/* --- login --- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.lcard{width:min(400px,100%);background:var(--pn);border:1px solid var(--ln);padding:28px 26px;text-align:center;backdrop-filter:blur(4px);box-shadow:0 20px 60px #0009}
.lcard h1{font-size:46px}.lcard h2{color:var(--fg);font-size:17px;margin:4px 0 20px;letter-spacing:1px;font-style:italic}
.lcard input{width:100%;margin:6px 0 10px;padding:10px}.lcard button{width:100%;padding:10px}
.err{color:var(--rd);min-height:20px;margin-top:8px;font-size:13px}
@keyframes drop{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
.lcard h1{animation:drop .8s cubic-bezier(.2,1.4,.4,1) both}
/* --- app --- */
#app{display:grid;grid-template-columns:210px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:10px 18px;background:rgba(10,13,24,.92);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header .logo{font-size:24px}header .sub{color:var(--mu);font-style:italic}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
.chip{background:var(--pn2);border:1px solid #ffffff1a;border-radius:20px;padding:4px 11px;font-size:12.5px;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gr);margin-right:6px;box-shadow:0 0 8px var(--gr)}.dot.off{background:var(--rd);box-shadow:0 0 8px var(--rd)}
nav{padding:14px 10px;background:rgba(12,15,28,.78);border-right:1px solid var(--ln);display:flex;flex-direction:column;gap:3px}
nav button{text-align:left;background:transparent;border:1px solid transparent;padding:9px 12px;color:var(--fg);display:flex;align-items:center;gap:10px}
nav button:hover{background:#ffffff0d}nav button.on{background:#5a432088;border-color:#f5b94266;color:var(--ac)}
nav .ic{width:20px;text-align:center}nav .n{margin-left:auto;font-size:11.5px;background:#ffffff14;border-radius:10px;padding:1px 7px;color:var(--mu)}
main{padding:18px;min-width:0}
.card{background:var(--pn);border:1px solid var(--ln);padding:16px 18px;margin-bottom:16px;backdrop-filter:blur(3px)}
.card>h3{color:var(--ac);font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:8px}.card>h3 .r{margin-left:auto}
.pagehead{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}.pagehead h2{font-size:24px;color:var(--fg)}.pagehead .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.tile{background:var(--pn2);border:1px solid #ffffff14;border-left:3px solid var(--ac);padding:12px 14px}
.tile .v{font-size:26px;color:var(--fg);margin-top:2px}.tile .l{color:var(--mu);font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}.row>input[type=text],.row>input:not([type]),.row>.grow{flex:1;min-width:140px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid #ffffff12;text-align:left;vertical-align:middle}
th{color:var(--mu);font-weight:normal;font-size:12.5px;white-space:nowrap}tr:hover td{background:#ffffff06}
.hp{width:80px;height:9px;background:#0008;border:1px solid #fff3;position:relative}.hp i{display:block;height:100%;background:#d33}
.tag{font-size:11.5px;padding:2px 8px;border-radius:10px;background:#ffffff14;white-space:nowrap}
.tag.join{background:#4cc46a26;color:#8fe0a3}.tag.leave{background:#9aa4b826}.tag.kick,.tag.ban{background:#e5534b30;color:#ff9c96}.tag.admin{background:#f5b94230;color:var(--ac)}.tag.arena{background:#b866ff30;color:#d9a8ff}.tag.trade{background:#4aa3ff30;color:#9fd0ff}.tag.dungeon{background:#ff9a5a30;color:#ffc29a}.tag.item{background:#4cc46a1f;color:#b8f0c4}.tag.sys{background:#ffffff1a}.tag.plugin{background:#3ad0c030;color:#9ff0e6}
.plug h4{margin:0 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.plug .st{font-size:12px;padding:1px 8px;border-radius:10px}.plug .st.on{background:#4cc46a26;color:#8fe0a3}.plug .st.off{background:#9aa4b826;color:var(--mu)}.plug .st.bad{background:#e5534b30;color:#ff9c96}.plug code{font-size:12px}.plug .err{color:#ff9c96;font-size:13px;margin:6px 0;word-break:break-word}
.loglist,.chatlist{max-height:520px;overflow-y:auto}
.ll{display:flex;gap:10px;padding:5px 2px;border-bottom:1px solid #ffffff0d;align-items:baseline}.ll .t{color:var(--mu);font-size:12px;white-space:nowrap;font-family:monospace}
.cm b{color:#7ec8ff}.cm.adm b,.cm.adm{color:var(--or)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #ffffff0d}.sw:last-child{border:0}
.sw .d{color:var(--mu);font-size:12.5px;margin-top:2px}
.tg{position:relative;width:44px;height:24px;flex-shrink:0}.tg input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.tg span{position:absolute;inset:0;background:#3a3f50;border-radius:12px;transition:.15s;border:1px solid #fff2}.tg span:after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#ccd;transition:.15s}
.tg input:checked+span{background:#5a4320;border-color:var(--ac)}.tg input:checked+span:after{left:23px;background:var(--ac)}.tg input:focus-visible+span{outline:2px solid var(--ac)}
.pc{display:inline-flex;align-items:flex-end;gap:1px;vertical-align:baseline}.pc i{display:inline-block;width:2px;border-radius:1px}
.empty{color:var(--mu);font-style:italic;padding:10px 0}
.room{background:var(--pn2);border:1px solid #ffffff14;padding:12px 14px}.room h4{font-size:18px;color:var(--ac);margin-bottom:6px}
.dgg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 12px;margin:10px 0}.dgg label{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--fg)}.dgg input{width:64px}
.danger{border-color:#e5534b66}.danger>h3{color:#ff8a82}
/* --- modale e notifiche --- */
#modal{position:fixed;inset:0;z-index:20;background:#05070ecc;display:none;align-items:center;justify-content:center;padding:16px}
#modal .box{width:min(620px,100%);max-height:90vh;overflow:auto;background:#161b2c;border:2px solid var(--ac);padding:18px 20px;box-shadow:0 20px 60px #000}
#modal h3{color:var(--ac);font-size:20px;margin-bottom:10px}#modal h4{color:var(--fg);margin:14px 0 6px;font-size:15px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px}.kv>div{border-bottom:1px solid #ffffff10;padding:3px 0}.kv>div>span:first-child{color:var(--mu);font-size:12px;display:block}
#toasts{position:fixed;right:16px;top:16px;z-index:30;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:#1b2030;border:1px solid var(--ac);border-left:4px solid var(--gr);padding:10px 14px;box-shadow:0 8px 24px #0008;animation:tin .25s both}.toast.bad{border-left-color:var(--rd)}
@keyframes tin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}nav{align-items:center;align-self:start;position:sticky;top:0}header{grid-column:1}nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ln);padding:8px}nav button{flex-shrink:0}nav .n{display:none}main{padding:12px}.chips{margin-left:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- stanze e dungeon ---------- */
function roomsView(){const R=S.rooms;let h=`<div class="pagehead"><h2>Stanze</h2><div class="r"><button class="sm" onclick="poll().then(()=>go('rooms'))">↻ Aggiorna</button></div></div>`;
  if(!R.length)return h+'<div class="card"><p class="empty">Nessuna stanza: comparirà quando qualcuno entra con un codice stanza.</p></div>';
  h+='<div class="grid g2">';for(const r of R){const id=esc(r.code);
    h+=`<div class="room"><h4>🏰 ${id||'<i>senza codice</i>'} <span class="mu" style="font-size:13px">· ${r.players.length} online</span></h4><div>${r.players.length?r.players.map(n=>`<span class="tag" style="margin:2px">${esc(n)}</span>`).join(''):'<span class="mu">Nessuno online</span>'}</div>`;
    if(r.code){h+=`<div class="dgg">${S.dungeons.map(d=>`<label>${DGN[d]}<span><input type="number" min="1" max="100" value="${(r.runs[d]||0)+1}" id="rn_${id}_${d}" aria-label="Ciclo di ${DGN[d]}"></span></label>`).join('')}</div>
      <div class="row"><button class="sm gold" onclick="saveRuns('${id}')">Salva cicli</button><button class="sm red" onclick="confirmBox('Riportare tutti i dungeon al ciclo 1?','Stanza ${id}: le mappe e la difficoltà dei dungeon tornano a quelle iniziali.','Azzera',1).then(y=>y&&act({a:'runsreset',code:'${id}'}).then(()=>go('rooms')))">Azzera dungeon</button></div>
      <div class="row"><input id="rm_${id}" maxlength="160" placeholder="Annuncio a questa stanza"><button class="sm" onclick="ann('rm_${id}','${id}')">Invia</button></div>`}
    h+='</div>'}return h+'</div><p class="mu">Il numero è il ciclo del dungeon: più è alto, più nemici e bottino sono forti (+3 livelli per ciclo). Chi è già dentro il dungeon vede il cambiamento quando esce e rientra.</p>'}
async function saveRuns(code){let n=0;for(const d of S.dungeons){const el=$('rn_'+code+'_'+d),v=Math.max(1,Math.min(100,+el.value||1))-1,cur=(S.rooms.find(r=>r.code===code).runs[d]||0);if(v!==cur){await act({a:'runs',code,d,v});n++}}if(!n)toast('Nessun ciclo modificato');go('rooms')}

let LBL=[];

function lbTable(){const q=lbQ.toLowerCase();LBL=S.lb.filter(r=>!q||r.n.toLowerCase().includes(q));
  $('lbt').innerHTML=LBL.length?`<table><tr><th>#</th><th>Eroe</th><th>Vittorie</th><th>Sconfitte</th><th>Punti totali</th><th>Da spendere</th><th></th></tr>${LBL.map((r,i)=>`<tr><td>${['🥇','🥈','🥉'][S.lb.indexOf(r)]||S.lb.indexOf(r)+1}</td><td><b>${esc(r.n)}</b></td>${['w','l','pts','ap'].map(f=>`<td><input type="number" min="0" id="lb_${f}_${i}" value="${r[f]}" aria-label="${f} di ${esc(r.n)}"></td>`).join('')}<td style="white-space:nowrap"><button class="sm gold" onclick="lbSave(${i})">Salva</button> <button class="sm red" onclick="lbDel(${i})">Rimuovi</button></td></tr>`).join('')}</table>`:`<p class="empty">${S.lb.length?'Nessun risultato.':'La classifica è vuota.'}</p>`}

function lbReset(){confirmBox('Azzerare tutta la classifica?','Cancella vittorie, sconfitte e punti arena di TUTTI i giocatori. Non si può annullare (salvo un backup).','Azzera tutto',1,'AZZERA').then(y=>y&&act({a:'lbreset'}).then(()=>go('lb')))}

/* ---------- 7.6: mondi pubblicati con Voxelia Studio ---------- */
let MDS=null,mdTab='w',mdQ='';
async function mdLoad(){try{const{ok,j}=await api('/admin/api/mondi');if(!ok)return;MDS=j;mdRender()}catch(e){if(e.message!=='auth')toast('Server non raggiungibile',1)}}
const mdAct=o=>act(o).then(ok=>{mdLoad();return ok});
const mdAgo=t=>{const s=(Date.now()-t)/1000;return s<3600?Math.max(1,Math.floor(s/60))+' min fa':s<86400?Math.floor(s/3600)+' ore fa':Math.floor(s/86400)+' giorni fa'};
function mdRender(){const el=$('mdv');if(!el||!MDS)return;const D=MDS,q=mdQ.toLowerCase(),L=D.list.filter(w=>!q||(w.n+' '+w.a).toLowerCase().includes(q));
  const tabs=[['w','🌐 Mondi',D.list.length],['rep','🚩 Segnalazioni',D.reps.length],['com','💬 Commenti',D.com.length],['rev','⭐ Recensioni',D.rev.length]];
  let h=`<div class="grid g2"><div class="card"><h3>🌐 Pubblicazioni</h3>${sw('md-open',D.open,'Pubblicazioni, recensioni e commenti aperti','Se spento, i giocatori possono solo giocare ai mondi già pubblicati.',"mdAct({a:'mopen',on:this.checked})")}</div>
    <div class="card"><h3>💾 Spazio</h3><p>${D.list.length} ${D.list.length===1?'mondo':'mondi'} · ${(D.bytes/1048576).toFixed(1)} MB tra mondi, immagini e video</p><p class="mu">Cartella: ${esc(D.dir)}</p></div></div>
    <div class="row" style="margin-bottom:10px">${tabs.map(([k,l,n])=>`<button class="sm${mdTab===k?' gold':''}" onclick="mdTab='${k}';mdRender()">${l} <span class="mu">${n}</span></button>`).join('')}${mdTab==='w'?`<input id="mdq" placeholder="🔍 Cerca titolo o autore" value="${esc(mdQ)}" oninput="mdQ=this.value;mdRender();const e=$('mdq');e.focus();e.setSelectionRange(e.value.length,e.value.length)" style="margin-left:auto">`:''}</div><div class="card"><div class="tw">`;
  if(mdTab==='w')h+=L.length?`<table><tr><th></th><th>Mondo</th><th>Autore</th><th>Partite</th><th>Stelle</th><th>💬</th><th>Pubblicato</th><th>🚩</th><th></th></tr>${L.map(w=>`<tr><td>${w.cover?`<img src="${esc(w.cover)}" alt="" style="width:96px;height:54px;object-fit:cover;border-radius:4px;display:block">`:''}</td>
      <td><b>${esc(w.n)}</b>${w.pin?' <span class="tag join">⭐ in evidenza</span>':''}${w.hide?' <span class="tag">nascosto</span>':''}${w.hot>=6?` <span class="tag">🔥 ${w.hot}</span>`:''}<br><span class="mu">${w.maps} mappe · ${(w.size/1024).toFixed(0)} KB${w.vid?' · video':''}${w.nimg?' · '+w.nimg+' immagini':''}</span></td>
      <td>${esc(w.a)}${w.blk?' <span class="tag ban">bloccato</span>':''}</td><td>${w.st.p} <span class="mu">(${w.st.pu} giocatori)</span></td><td>${w.r.n?w.r.avg+' ★ <span class="mu">('+w.r.n+')</span>':'<span class="mu">—</span>'}</td><td>${w.st.c}</td><td class="mu">${mdAgo(w.t0)}</td><td>${w.reps?`<b style="color:#ff9c96">${w.reps}</b>`:''}</td>
      <td style="white-space:nowrap"><button class="sm${w.pin?' gold':''}" onclick="mdAct({a:'mpin',id:'${esc(w.id)}'})">${w.pin?'Togli dall\'evidenza':'⭐ Metti in evidenza'}</button><button class="sm" onclick="mdAct({a:'mhide',id:'${esc(w.id)}'})">${w.hide?'Mostra':'Nascondi'}</button>
      <button class="sm" onclick="mdAct({a:'mblk',u:'${esc(w.au)}'})">${w.blk?'Sblocca autore':'Blocca autore'}</button><button class="sm red" onclick="confirmBox('Eliminare «'+${JSON.stringify(w.n).replace(/"/g,'&quot;')}+'»?','Spariscono il mondo, le anteprime, le recensioni e i commenti. Non si può annullare.','Elimina',1).then(y=>y&&mdAct({a:'mdel',id:'${esc(w.id)}'}))">Elimina</button></td></tr>`).join('')}</table>`:`<p class="empty">${D.list.length?'Nessun mondo corrisponde alla ricerca.':'Nessun mondo pubblicato su questo server.'}</p>`;
  if(mdTab==='rep')h+=D.reps.length?`<table><tr><th>Quando</th><th>Mondo</th><th>Da</th><th>Motivo</th><th></th></tr>${D.reps.map(r=>`<tr><td class="mu">${mdAgo(r.t)}</td><td><b>${esc(r.wn)}</b></td><td>${esc(r.n)}</td><td>${esc(r.why||'—')}</td><td style="white-space:nowrap"><button class="sm" onclick="mdAct({a:'mrep',i:${r.i}})">Archivia</button>${D.list.some(w=>w.id===r.w)?`<button class="sm" onclick="mdAct({a:'mhide',id:'${esc(r.w)}'})">Nascondi il mondo</button>`:''}</td></tr>`).join('')}</table>`:'<p class="empty">Nessuna segnalazione.</p>';
  if(mdTab==='com')h+=D.com.length?`<table><tr><th>Quando</th><th>Mondo</th><th>Chi</th><th>Commento</th><th></th></tr>${D.com.map(c=>`<tr><td class="mu">${mdAgo(c.t)}</td><td>${esc(c.wn)}</td><td>${esc(c.n)}</td><td style="white-space:pre-wrap">${esc(c.tx)}</td><td><button class="sm red" onclick="mdAct({a:'mcom',id:'${esc(c.w)}',cid:'${esc(c.id)}'})">Elimina</button></td></tr>`).join('')}</table>`:'<p class="empty">Nessun commento.</p>';
  if(mdTab==='rev')h+=D.rev.length?`<table><tr><th>Quando</th><th>Mondo</th><th>Chi</th><th>Stelle</th><th>Testo</th><th></th></tr>${D.rev.map(r=>`<tr><td class="mu">${mdAgo(r.t)}</td><td>${esc(r.wn)}</td><td>${esc(r.n)}</td><td>${'★'.repeat(r.s)}</td><td style="white-space:pre-wrap">${esc(r.tx)}</td><td><button class="sm red" onclick="mdAct({a:'mrev',id:'${esc(r.w)}',u:'${esc(r.u)}'})">Elimina</button></td></tr>`).join('')}</table>`:'<p class="empty">Nessuna recensione con testo.</p>';
  el.innerHTML=h+'</div></div>'}

/* ---------- azioni ---------- */
function ann(id,code){const s=$(id).value.trim();if(!s)return toast('Scrivi prima il messaggio',1);act({a:'ann',s,code}).then(ok=>{if(ok)$(id).value=''})}
function say(){const code=$('chcode').value,s=$('chtxt').value.trim();if(!code)return toast('Nessuna stanza attiva',1);if(!s)return;act($('chann').checked?{a:'ann',s,code}:{a:'say',s,code}).then(ok=>{if(ok)$('chtxt').value=''})}
function banName(){const n=$('bn').value.trim();if(!n)return toast('Scrivi il nome',1);confirmBox('Bandire '+n+'?','Non potrà più entrare con questo nome finché non togli il ban.','Bandisci',1).then(y=>y&&act({a:'ban',n,s:$('bs').value}).then(ok=>{if(ok){$('bn').value='';$('bs').value=''}}))}
function chpw(){const a=$('pw1').value;if(a!==$('pw2').value)return toast('Le nuove password non coincidono',1);act({a:'pw',old:$('pw0').value,pw:a}).then(ok=>{if(ok)['pw0','pw1','pw2'].forEach(i=>$(i).value='')})}
function kickAll(){confirmBox('Disconnettere tutti i giocatori?','Tutti tornano al menu del gioco. Puoi aggiungere un motivo:','Disconnetti tutti',1,null,true).then(r=>r&&act({a:'kickall',s:typeof r==='string'?r:''}))}
function shutdown(){confirmBox('Arrestare il server?','I dati vengono salvati e tutti i giocatori disconnessi. Il pannello smetterà di rispondere finché non riavvii node server.js.','Arresta il server',1,'ARRESTA').then(y=>{if(y)act({a:'shutdown'}).then(()=>setTimeout(()=>setOn(0),1500))})}
function copy(s){navigator.clipboard&&navigator.clipboard.writeText(s).then(()=>toast('Copiato: '+s),()=>toast('Copia non riuscita',1))}

/* ---------- gestione di un giocatore ---------- */
function manage(id){mopen=()=>{const p=S.players.find(x=>x.id===id),b=$('mbox');const ae=document.activeElement;if(!(b.contains(ae)&&/INPUT|SELECT/.test(ae.tagName))||!p){const foc=ae&&ae.dataset&&ae.dataset.k;b.innerHTML=manageHTML(p,id);if(foc){const e=b.querySelector('[data-k="'+foc+'"]');e&&e.focus()}}};mopen();$('modal').style.display='flex';const f=$('mbox').querySelector('button');f&&f.focus()}
function manageHTML(p,id){if(!p)return`<h3>Giocatore disconnesso</h3><p class="mu">Non è più online.</p><div class="row"><button onclick="closeM()">Chiudi</button></div>`;
  const a=p.ar,n=esc(p.n);
  return`<h3>👤 ${n} <span class="mu" style="font-size:14px">· Livello ${p.lv}</span></h3><div class="kv">
  <div><span>Stanza</span>${esc(p.code||'—')}</div><div><span>Posizione</span>${esc(zone(p.z))} (${p.x|0}, ${p.y|0})</div><div><span>Vita</span>${p.hp} / ${p.mx}</div><div><span>Difficoltà</span><b style="color:${DFC[p.df]||'#aaa'}">${DFN[p.df]||'—'}</b></div>
  <div><span>Oro</span>${p.g}</div><div><span>Ping</span>${ping(p.ping)}</div><div><span>IP</span>${esc(p.ip)}</div><div><span>Connesso da</span>${dur(Date.now()-p.at)}</div>
  <div><span>Arena</span>${a?a.w+' V · '+a.l+' S · '+a.pts+' punti':'—'}</div><div><span>Chat</span>${p.muted?'🔇 Silenziato':'Può scrivere'}</div></div>
  <h4>🎁 Regali</h4>
  <div class="row"><input type="number" id="g-gold" value="500" min="1" aria-label="Oro"><button class="sm" onclick="give('${id}','gold','g-gold')">💰 Dai oro</button><input type="number" id="g-xp" value="200" min="1" aria-label="Esperienza"><button class="sm" onclick="give('${id}','xp','g-xp')">⭐ Dai XP</button></div>
  <div class="row"><input type="number" id="g-pot" value="5" min="1" max="99" aria-label="Pozioni"><button class="sm" onclick="give('${id}','pot','g-pot')">🧪 Dai pozioni</button><input type="number" id="g-lv" value="1" min="1" max="50" aria-label="Livelli"><button class="sm" onclick="give('${id}','lv','g-lv')">⬆ Dai livelli</button></div>
  <div class="row"><select id="g-r" aria-label="Rarità"><option value="0">Comune</option><option value="1">Raro</option><option value="2">Epico</option><option value="3" selected>Leggendario</option></select><button class="sm" onclick="act({a:'give',id:'${id}',k:'item',r:+$('g-r').value})">⚔ Dai oggetto casuale</button></div>
  <h4>✚ Aiuto</h4><div class="row"><button class="sm" onclick="act({a:'give',id:'${id}',k:'heal'})">✚ Cura completa</button><button class="sm" onclick="act({a:'give',id:'${id}',k:'tp'})">🏠 Teletrasporta ad Aldoria</button></div>
  <h4>🛡 Moderazione</h4><div class="row"><button class="sm" onclick="act({a:'mute',id:'${id}'})">${p.muted?'🔊 Togli silenzio':'🔇 Silenzia in chat'}</button></div>
  <div class="row"><input id="m-s" maxlength="100" placeholder="Motivo (facoltativo, lo vede il giocatore)"></div>
  <div class="row"><button class="sm red" onclick="kickP('${id}')">Espelli</button><button class="sm red" onclick="banP('${id}',false)">Bandisci nome</button><button class="sm red" onclick="banP('${id}',true)">Bandisci nome e IP</button></div>
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button onclick="closeM()">Chiudi</button></div>`}
function give(id,k,inp){act({a:'give',id,k,n:+$(inp).value})}
function kickP(id){const p=S.players.find(x=>x.id===id),why=$('m-s').value;if(!p)return;confirmBox('Espellere '+p.n+'?','Torna al menu del gioco. Potrà rientrare subito.','Espelli',1).then(y=>y&&act({a:'kick',id,s:why}).then(closeM))}
function banP(id,ip){const p=S.players.find(x=>x.id===id),why=$('m-s').value;if(!p)return;confirmBox('Bandire '+p.n+(ip?' e il suo IP':'')+'?',ip?'Blocca il nome e l\'indirizzo '+p.ip+'. Attenzione: chi gioca dalla stessa rete (stessa casa) avrà lo stesso IP.':'Non potrà più entrare con questo nome finché non togli il ban.','Bandisci',1).then(y=>y&&act({a:'ban',id,ip,s:why}).then(closeM))}
function closeM(){mopen=null;$('modal').style.display='none'}
$('modal').onclick=e=>{if(e.target.id==='modal')closeM()};
onkeydown=e=>{if(e.key==='Escape'&&$('modal').style.display==='flex'){if(window.cfRes)window.cfRes(false);closeM()}};

/* ---------- finestra di conferma ---------- */
function confirmBox(t,d,ok,danger,typed,withText){return new Promise(res=>{window.cfRes=v=>{window.cfRes=null;mopen=null;$('modal').style.display='none';res(v)};mopen=null;
  $('mbox').innerHTML=`<h3>${esc(t)}</h3><p>${esc(d)}</p>${typed?`<p class="mu">Per confermare scrivi <b>${typed}</b>:</p><input id="cf-t" style="width:100%" autocomplete="off">`:''}${withText?`<input id="cf-x" maxlength="100" style="width:100%" placeholder="Motivo (facoltativo)">`:''}
  <div class="row" style="justify-content:flex-end;margin-top:16px"><button onclick="cfRes(false)">Annulla</button><button class="${danger?'red':'gold'}" id="cf-ok">${esc(ok)}</button></div>`;
  $('modal').style.display='flex';const okb=$('cf-ok');
  okb.onclick=()=>{if(typed&&$('cf-t').value.trim().toUpperCase()!==typed){toast('Scrivi '+typed+' per confermare',1);return}window.cfRes(withText?($('cf-x').value.trim()||true):true)};
  ($('cf-t')||$('cf-x')||okb).focus()})}

/* ---------- avvio: se la sessione è ancora valida entra subito ---------- */
api('/admin/api/state').then(r=>{if(r.ok){S=r.j;showApp()}}).catch(()=>{});
</script></body></html>
