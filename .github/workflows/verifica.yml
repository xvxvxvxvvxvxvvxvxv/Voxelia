name: Verifica

# 7.53: a ogni push e a ogni pull request controlla build, sintassi, numeri di versione e un server di prova
# (tools/verifica.sh). Una PR con il gioco rotto si vede subito, prima del merge.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verifica di Voxelia
        run: sh tools/verifica.sh
        env:
          VERIFICA_CI: '1'
      # 8.1: la prova automatica gioca ogni modalità, i salvataggi e due giocatori in rete (tools/prova.js)
      - name: Playwright con Chromium
        run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Prova automatica di Voxelia
        run: node tools/prova.js
